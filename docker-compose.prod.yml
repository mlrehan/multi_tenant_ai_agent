# Production-*shaped* compose -- docs/22-deployment-and-operations.md.
#
# This is a reference topology and a local rehearsal of the production wiring
# (separate migration job, non-root app, three DB roles, no port exposure for
# datastores). It is NOT a production deployment target: a real one runs on an
# orchestrator with managed Postgres/Redis, secrets injected from a secret
# manager, and horizontal scaling. What it *does* prove is that the image
# boots with production settings and that migrations work as a separate step.
#
# Every secret below is read from the host environment with no default, so
# `docker compose -f docker-compose.prod.yml up` fails loudly rather than
# silently starting with a weak credential. They come from the `.env` file
# beside this one, which must be `chmod 600` and is git-ignored.
#
# The API and the worker share one environment block by anchor. They must not
# drift: the worker parses, embeds and indexes documents, so it needs the same
# storage, Qdrant and OpenAI settings the API reads back. A worker missing one
# of them fails *asynchronously*, leaving a document stuck in `processing`
# with nobody watching.

x-app-env: &app-env
  ENVIRONMENT: production
  # This deployment keeps its secrets in the `chmod 600` .env beside this file
  # rather than a managed secret manager. `env` is normally refused when
  # ENVIRONMENT=production; ALLOW_PLAINTEXT_SECRETS is the deliberate opt-out
  # (core/config.py explains what it trades away). Switch SECRET_PROVIDER to
  # aws_secrets_manager and drop the flag to move to managed secrets later --
  # the values below then become `secret://` references and nothing else here
  # changes.
  SECRET_PROVIDER: ${SECRET_PROVIDER:-env}
  ALLOW_PLAINTEXT_SECRETS: ${ALLOW_PLAINTEXT_SECRETS:-true}
  DATABASE__HOST: postgres
  DATABASE__PORT: "5432"
  DATABASE__NAME: iam_platform
  DATABASE__USER: app_tenant
  DATABASE__PASSWORD: ${APP_TENANT_PASSWORD:?}
  DATABASE__PLATFORM_USER: app_platform
  DATABASE__PLATFORM_PASSWORD: ${APP_PLATFORM_PASSWORD:?}
  # Neither service ever needs DDL rights; migrator credentials are
  # intentionally absent from both.
  REDIS__URL: redis://redis:6379/0
  # Defaulted to `example.invalid` in code, which would be baked into the
  # `iss` claim of every token this deployment issues.
  JWT__ISSUER: ${JWT__ISSUER:?set JWT__ISSUER, e.g. https://yourdomain.com}
  JWT__AUDIENCE: ${JWT__AUDIENCE:-iam-platform-api}
  JWT__PRIVATE_KEY_PEM: ${JWT__PRIVATE_KEY_PEM:?}
  JWT__PUBLIC_KEY_PEM: ${JWT__PUBLIC_KEY_PEM:?}
  ENCRYPTION__DATA_KEY: ${ENCRYPTION__DATA_KEY:?}
  # --- Knowledge base / RAG ---------------------------------------------
  # Uploaded bytes stay on this server, under the `uploads` named volume
  # below. The container root filesystem is read-only and must stay that way,
  # so that volume is what makes uploads possible at all -- and the Dockerfile
  # pre-creates the path owned by `app`, or the mount would be root-owned and
  # the first upload would fail on `mkdir`.
  #
  # `docker compose down -v` deletes this. Back it up with the database.
  STORAGE__MODE: ${STORAGE__MODE:-local}
  STORAGE__LOCAL_PATH: /var/lib/iam-platform/storage
  STORAGE__R2_ACCOUNT_ID: ${STORAGE__R2_ACCOUNT_ID:-}
  STORAGE__R2_BUCKET: ${STORAGE__R2_BUCKET:-}
  STORAGE__R2_ACCESS_KEY_ID: ${STORAGE__R2_ACCESS_KEY_ID:-}
  STORAGE__R2_SECRET_ACCESS_KEY: ${STORAGE__R2_SECRET_ACCESS_KEY:-}
  QDRANT__URL: ${QDRANT__URL:-http://qdrant:6333}
  QDRANT__API_KEY: ${QDRANT__API_KEY:-}
  QDRANT__TIMEOUT_SECONDS: ${QDRANT__TIMEOUT_SECONDS:-30}
  OPENAI__API_KEY: ${OPENAI__API_KEY:-}
  OPENAI__EMBEDDING_MODEL: ${OPENAI__EMBEDDING_MODEL:-text-embedding-3-large}
  OPENAI__EMBEDDING_DIMENSIONS: ${OPENAI__EMBEDDING_DIMENSIONS:-3072}
  OPENAI__CHAT_MODEL: ${OPENAI__CHAT_MODEL:-gpt-5.5}
  # Deliberately passed through unset-if-blank. A non-reasoning model rejects
  # this parameter outright, so an empty value must mean "omit the key",
  # never "send an empty one".
  OPENAI__CHAT_REASONING_EFFORT: ${OPENAI__CHAT_REASONING_EFFORT:-}
  OPENAI__REQUEST_TIMEOUT_SECONDS: ${OPENAI__REQUEST_TIMEOUT_SECONDS:-60}
  COHERE__API_KEY: ${COHERE__API_KEY:-}
  COHERE__RERANK_MODEL: ${COHERE__RERANK_MODEL:-rerank-v3.5}
  TAVILY__API_KEY: ${TAVILY__API_KEY:-}
  # Web Push, so an agent is alerted with the console closed. Blank disables
  # it; the inbox still works, the notification simply never arrives.
  PUSH__VAPID_PUBLIC_KEY: ${PUSH__VAPID_PUBLIC_KEY:-}
  PUSH__VAPID_PRIVATE_KEY: ${PUSH__VAPID_PRIVATE_KEY:-}
  PUSH__VAPID_SUBJECT: ${PUSH__VAPID_SUBJECT:-mailto:ops@example.com}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# Log rotation. Without this the json-file driver grows without limit until
# the server's disk is full -- which takes down every container at once,
# including the database, and is one of the commonest ways a small Docker
# host dies. 20 MB x 5 files per service is a few hours of busy traffic and
# bounded at roughly 500 MB across the stack.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: iam_platform
      # Read by `docker/postgres-init/01-roles.sh` when the database is first
      # created, to give `app_tenant` and `app_platform` the same passwords the
      # API and worker connect with. Without them the roles would be created
      # with a password nothing uses and every application connection would
      # fail authentication.
      APP_TENANT_PASSWORD: ${APP_TENANT_PASSWORD:?set APP_TENANT_PASSWORD}
      APP_PLATFORM_PASSWORD: ${APP_PLATFORM_PASSWORD:?set APP_PLATFORM_PASSWORD}
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    # Deliberately no `ports:` -- the database is reachable only on the
    # compose network. Exposing 5432 to the host is a dev-only convenience.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam_platform"]
      interval: 5s
      timeout: 3s
      # First boot creates the cluster and runs the role script, which on a
      # small cloud VM takes appreciably longer than a restart. `start_period`
      # is not counted as failures, so a slow initialisation cannot exhaust
      # the retries and mark the database permanently unhealthy.
      retries: 20
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Persistence off on purpose: Redis holds only cache and rate-limit state
    # (docs/06-authorization-model.md -- "never authoritative"), so durability
    # buys nothing and an RDB dump on disk is one more place session-adjacent
    # data could linger.
    #
    # It is also the Celery broker. That is not a contradiction: a lost job is
    # a document that shows as `failed` and can be retried from the console,
    # whereas the queue is empty for seconds at a time in normal operation.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  qdrant:
    # Vector store for knowledge-base search. Pinned to match `qdrant-client`
    # in pyproject.toml: the client refuses more than one minor version of
    # skew. Bump both together.
    #
    # No `ports:` -- like Postgres, it is reachable only on the compose
    # network. An unauthenticated Qdrant exposed to the internet is every
    # tenant's indexed documents, readable by anyone who finds the port.
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # Checks the port is *accepting connections*, not merely that the binary
      # runs. `entrypoint.sh --version` was the previous probe and passes on a
      # container whose service has not finished starting -- which would let
      # the API and worker start against a Qdrant that is not listening yet.
      #
      # The image carries bash (verified by running it), so this works. An
      # earlier comment here claimed it was distroless with no shell; that was
      # simply wrong, and it is why the weaker probe was chosen.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: iam-platform:latest
    # Runs as the migrator (table-owning) role and exits. The app service
    # waits for it to complete successfully, so a failed migration blocks the
    # rollout instead of leaving the app running against a stale schema.
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: production
      SECRET_PROVIDER: ${SECRET_PROVIDER:-env}
      ALLOW_PLAINTEXT_SECRETS: ${ALLOW_PLAINTEXT_SECRETS:-true}
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__NAME: iam_platform
      DATABASE__MIGRATOR_USER: postgres
      DATABASE__MIGRATOR_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      DATABASE__USER: app_tenant
      DATABASE__PASSWORD: ${APP_TENANT_PASSWORD:?set APP_TENANT_PASSWORD}
      DATABASE__PLATFORM_USER: app_platform
      DATABASE__PLATFORM_PASSWORD: ${APP_PLATFORM_PASSWORD:?set APP_PLATFORM_PASSWORD}
      REDIS__URL: redis://redis:6379/0
      JWT__PRIVATE_KEY_PEM: ${JWT__PRIVATE_KEY_PEM:?}
      JWT__PUBLIC_KEY_PEM: ${JWT__PUBLIC_KEY_PEM:?}
      ENCRYPTION__DATA_KEY: ${ENCRYPTION__DATA_KEY:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    # The one service that builds; `migrate` and `worker` reuse this tag.
    build: .
    image: iam-platform:latest
    environment:
      <<: *app-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      # Where third-party pages reach this API, used to build the <script>
      # snippet tenants paste into their own sites. Behind a reverse proxy the
      # request's own Host may not survive, and the snippet would then point
      # at the wrong hostname -- on someone else's website, where nobody here
      # would see it fail.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    volumes:
      - uploads:/var/lib/iam-platform/storage
    ports:
      # **Bound to localhost, and this is a security control, not a
      # preference.** `- "8000:8000"` binds 0.0.0.0, and Docker publishes
      # ports by writing its own iptables rules in the DOCKER chain, which
      # are consulted *before* ufw's. A `ufw deny` on 8000 therefore does not
      # block it: the API would be reachable from the internet directly, over
      # plain HTTP, bypassing Nginx, TLS, and the security headers and rate
      # limits the proxy adds. Nginx reaches it on the loopback instead.
      #
      # The HOST side is configurable via API_HOST_PORT -- only Nginx ever
      # connects to it (over loopback), so nothing else on the internet-facing
      # side depends on which number this is. Defaults to 8100, clear of the
      # common 8000/8080/3000 range a host is more likely to already have
      # something bound to. The CONTAINER side stays 8000 always -- that is
      # what uvicorn binds to inside the process, set in the Dockerfile's
      # `EXPOSE` and unrelated to what the host maps it to.
      - "127.0.0.1:${API_HOST_PORT:-8100}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Give the app time to finish in-flight requests; must exceed uvicorn's
    # timeout_graceful_shutdown (20s) in asgi.py.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    image: iam-platform:latest
    # **Required, not optional.** Ingestion runs here, not in the API: an
    # upload is accepted, queued, and then parsed, chunked, embedded and
    # indexed by this process. A deployment that starts only the API accepts
    # uploads and leaves every document on `processing` for ever, with no
    # error anywhere to explain it.
    #
    # `--pool=threads` because the work is I/O-bound (object storage, OpenAI,
    # Qdrant) and the parsers hold interpreter state that does not survive
    # forking cleanly.
    command:
      - celery
      - -A
      - iam_platform.workers.main:celery_app
      - worker
      - --loglevel=info
      - --pool=threads
      - --concurrency=${WORKER_CONCURRENCY:-4}
    environment:
      <<: *app-env
      # crawl4ai writes a local SQLite cache under `$HOME/.crawl4ai` the first
      # time it's imported (async_database.py), and `$HOME` here is
      # `/home/app` -- on the read-only rootfs below. Redirected at the one
      # writable path this container has (the tmpfs `/tmp` mount) rather than
      # relaxing `read_only`, which would widen the attack surface for every
      # other process in the container just to accommodate one library.
      CRAWL4_AI_BASE_DIRECTORY: /tmp/crawl4ai
    volumes:
      # The same volume the API writes uploads to. Two separate volumes would
      # mean the worker parsing a file the API had not written -- an immediate
      # "file not found" on every ingestion.
      - uploads:/var/lib/iam-platform/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # Asks the running worker to answer, rather than checking the process
      # exists: the failure this catches is a worker that booted, failed to
      # register its tasks and is silently consuming nothing.
      test: ["CMD-SHELL", "celery -A iam_platform.workers.main:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    # Longer than the API's: a document being embedded is mid-flight against a
    # third-party API, and killing it wastes work already paid for.
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  qdrant-storage:
  uploads:
