services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Bootstrap superuser -- plays `app_migrator` for local dev (migrations
      # + `docker/postgres-init/01-roles.sql` run as this role). The
      # application itself connects as `app_tenant` (non-superuser,
      # RLS-subject), created by that init script -- see
      # docs/18-schema-rls-and-migrations.md.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_only_superuser_password
      POSTGRES_DB: iam_platform
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam_platform"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  qdrant:
    # Vector store for knowledge-base search (docs/24-knowledge-base-ingestion-and-rag.md).
    # Present in dev so local work matches the production topology -- a
    # self-hosted Qdrant reached via QDRANT__URL -- rather than diverging from
    # it. No API key locally; a real deployment sets QDRANT__API_KEY.
    # Pinned to match the `qdrant-client` version in pyproject.toml: the
    # client refuses more than one minor version of skew and warns loudly.
    # Bump both together.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:56333:6333"  # REST
      - "127.0.0.1:56334:6334"  # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The image is distroless -- no curl, no wget, no shell utilities. Qdrant
      # ships its own healthcheck binary for exactly this reason; a CMD-SHELL
      # probe would fail even when the service is perfectly healthy.
      test: ["CMD", "/qdrant/entrypoint.sh", "--version"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant-storage:
