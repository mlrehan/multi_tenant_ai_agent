[project]
name = "iam-platform"
version = "0.1.0"
description = "Enterprise multi-tenant identity, authentication & authorization platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    # Required by FastAPI to parse multipart bodies -- without it the document
    # upload route raises at request time, not import time, so its absence is
    # invisible until someone actually uploads a file.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "pyotp>=2.9",
    "httpx>=0.27",
    "celery[redis]>=5.6.3",
    "crawl4ai>=0.9.2",

    # RAG / agent orchestration
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langchain-core>=1.5.3",

    # Fast tokenization
    "tiktoken>=0.13.0,<1",

    "playwright>=1.62.0",

    # Main structured document engine + RapidOCR
    "docling[rapidocr]>=2.119.0,<3.0.0",
    
    # Fast native PDF text-layer extraction (infrastructure/parsing/fast_pdf.py).
    # Docling already pulls this in, but relying on that is fragile -- it would
    # vanish the day docling swapped its PDF backend, and the fast path is not
    # an optional nicety: without it every text-native PDF goes back through the
    # ML pipeline at roughly 1,300x the cost.
    #
    # pypdfium2 (PDFium, BSD-3-Clause/Apache-2.0) rather than the better-known
    # PyMuPDF, which is AGPL-3.0 or paid commercial -- network copyleft is not
    # something to take on for a hosted multi-tenant product.
    "pypdfium2>=4.30.0,!=4.30.1,<6.0.0",

    # HTML parsing
    "beautifulsoup4>=4.15.0,<5",
    "lxml>=6.1.1,<7",

    # XML entity-expansion / XXE defence (infrastructure/parsing/structured.py).
    # The stdlib parser does not resolve *external* entities but does expand
    # internal ones: measured at 30,006 characters from a ~400-byte file.
    "defusedxml>=0.7.1,<0.8",

    # Encoding detection
    "charset-normalizer>=3.4,<4",

    # Embeddings / vector DB / reranking
    "openai>=2.53.0,<3",
    "qdrant-client>=1.19.0,<2",
    "cohere>=7.0.8,<8",

    # Web Push (RFC 8030/8291/8292) for agent notifications when the console
    # is closed. Not hand-rolled: the payload encryption is ECDH + HKDF +
    # AES128GCM with exact salt/nonce/info derivation, and a subtle mistake
    # there produces pushes the browser silently discards rather than an error
    # anyone can see.
    "pywebpush>=2.0,<3",

    # Web/search/storage
    "tavily-python>=0.7.27",
    "boto3>=1.43.66",
    
    "python-dotenv>=1.2.2",
    
    # OCR inference backend
    "onnxruntime>=1.28.0,<2",

    # Native Word parsing
    "python-docx>=1.2,<2",

    # Native PowerPoint parsing
    "python-pptx>=1.0.2,<2",

    # Native Excel parsing
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The embeddable widget is a non-Python file inside the package, and setuptools
# ships no such file into a wheel unless it is named here. Left implicit it
# would work in an editable install (which imports straight from `src/`) and be
# absent from the built image -- the exact shape of the `.dockerignore` and
# model-prefetch bugs Phase 11 found. `tests/unit/test_widget_script_ships.py`
# guards it.
[tool.setuptools.package-data]
"iam_platform.api.v1.public_chat" = ["*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Postgres/Redis instance (see tests/integration/README)",
    "unit: pure in-process test, no external services",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends()`/`Query()` in a default argument is the framework's
# documented DI pattern, not the mutable-default-argument bug B008 exists to
# catch -- these calls are cheap markers FastAPI itself never re-evaluates
# per-call, unlike an actual mutable default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    # Same rationale as Depends: FastAPI's parameter markers are declarations
    # read at route-registration time, not mutable default arguments.
    "fastapi.File",
    "fastapi.params.File",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

# Third-party libraries that ship no type information. Scoped per-module
# rather than set globally, so an untyped import anywhere else is still an
# error -- the point is to name the specific libraries we accept as opaque,
# not to switch the check off.
[[tool.mypy.overrides]]
module = [
    "boto3.*", "botocore.*", "qdrant_client.*", "cohere.*", "celery.*",
    "crawl4ai.*",
    # Web Push (RFC 8291/8292). No py.typed marker. Used behind the narrow,
    # fully typed `PyWebPushSender` adapter, so the untyped surface is one
    # function call wide.
    "pywebpush.*",
    # PDFium bindings; no py.typed marker. Used behind a narrow, fully typed
    # adapter (infrastructure/parsing/fast_pdf.py), so the untyped surface is
    # three calls wide.
    "pypdfium2.*",
    # Spreadsheet reader with no stubs. Touched only inside
    # `NativeXlsxParser._parse_sync`, which converts every cell to `str`
    # immediately, so nothing untyped escapes that method.
    "openpyxl.*",
    # Hardened XML parser with no stubs. Touched by exactly one call and one
    # exception class in `XmlParser.parse`; the value it returns is a stdlib
    # `ElementTree.Element`, which *is* typed, so nothing untyped escapes.
    "defusedxml.*",
]
ignore_missing_imports = true

# docling ships `py.typed`, so mypy would type-check the entire ML stack it
# pulls in -- minutes per run, for a package this project only ever touches
# through an `Any`-typed converter behind a lazy import. `skip` treats it as
# Any without analyzing it.
[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.importlinter]
root_package = "iam_platform"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "iam_platform.api",
    "iam_platform.workers",
    "iam_platform.infrastructure",
    "iam_platform.application",
    "iam_platform.core",
    "iam_platform.domain",
]

[[tool.importlinter.contracts]]
name = "Domain has no project-internal dependencies"
type = "forbidden"
source_modules = ["iam_platform.domain"]
forbidden_modules = [
    "iam_platform.core",
    "iam_platform.application",
    "iam_platform.infrastructure",
    "iam_platform.api",
    "iam_platform.workers",
]

[[tool.importlinter.contracts]]
name = "API does not import infrastructure directly"
type = "forbidden"
source_modules = ["iam_platform.api"]
forbidden_modules = ["iam_platform.infrastructure"]
